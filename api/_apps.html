<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#080807">
    <title>Portal | Differance Labs</title>
    <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/portal.css">
  </head>
  <body class="portal-body">
    <header class="launcher-header">
      <a class="launcher-brand" href="/" aria-label="Differance Labs home">
        <img src="/assets/mark.svg" alt="" width="36" height="36" aria-hidden="true">
        <span>Differance Labs</span>
      </a>
      <a class="sign-out-button" href="/api/logout">Sign out</a>
    </header>

    <main class="launcher-shell">
      <section class="launcher-title">
        <p class="portal-kicker" id="user-email">Loading</p>
        <p class="login-message" id="launch-message" hidden></p>
      </section>

      <section class="apps-grid" id="apps-grid" aria-live="polite"></section>

      <section class="empty-state" id="empty-state" hidden>
        <h1>
          <span>You've opened the door, but no one is home.</span>
          <span>Ring the doorbell</span>
        </h1>
        <button class="request-access-button" id="request-access-button" type="button" aria-label="Request access">
          <img src="/assets/mark.svg" alt="" width="44" height="44" aria-hidden="true">
        </button>
        <p class="request-access-status" id="request-access-status" aria-live="polite"></p>
      </section>
    </main>

    <script>
      const grid = document.querySelector("#apps-grid");
      const emptyState = document.querySelector("#empty-state");
      const requestAccessButton = document.querySelector("#request-access-button");
      const requestAccessStatus = document.querySelector("#request-access-status");
      const userEmail = document.querySelector("#user-email");
      const launchMessage = document.querySelector("#launch-message");
      const accents = ["#84a792", "#d9b36c", "#c77c64", "#7aa6d9", "#b69ad8", "#79b8a9", "#e2e0d6"];
      const launchErrors = {
        app_not_found: "That app is not available.",
        app_not_granted: "Your account is not granted for that app.",
        app_inactive: "That app is not active yet.",
        launch_unavailable: "App launch is temporarily unavailable.",
      };

      function createCard(app, index) {
        const canLaunch = Boolean(app.launchPath);
        const card = document.createElement(canLaunch ? "a" : "article");
        card.className = "app-card";
        card.style.setProperty("--card-accent", accents[index % accents.length]);

        if (canLaunch) {
          card.href = app.launchPath;
        } else {
          card.setAttribute("aria-disabled", "true");
        }

        const kind = document.createElement("span");
        kind.className = "app-kind";
        kind.textContent = app.kind;

        const title = document.createElement("span");
        title.className = "app-name";
        title.textContent = app.name;

        const status = document.createElement("span");
        status.className = "app-status";
        status.textContent = canLaunch ? app.statusLabel || "Launch" : "Unavailable";

        card.append(kind, title, status);
        return card;
      }

      async function loadApps() {
        const error = new URLSearchParams(window.location.search).get("error");

        if (launchErrors[error]) {
          launchMessage.textContent = launchErrors[error];
          launchMessage.hidden = false;
        }

        emptyState.hidden = true;
        requestAccessStatus.textContent = "";
        const response = await fetch("/api/session", { credentials: "same-origin" });

        if (response.status === 401 || response.status === 403) {
          window.location.replace(`/login?error=${response.status === 403 ? "access_denied" : "unauthenticated"}`);
          return;
        }

        if (!response.ok) {
          userEmail.textContent = "Unavailable";
          emptyState.hidden = false;
          return;
        }

        const session = await response.json();
        userEmail.textContent = session.user.email;

        if (!session.apps.length) {
          grid.replaceChildren();
          emptyState.hidden = false;
          return;
        }

        emptyState.hidden = true;
        grid.replaceChildren(...session.apps.map(createCard));
      }

      loadApps().catch(() => {
        userEmail.textContent = "Unavailable";
        emptyState.hidden = false;
      });

      requestAccessButton.addEventListener("click", async () => {
        requestAccessButton.disabled = true;
        requestAccessStatus.textContent = "Sending request";

        try {
          const response = await fetch("/api/request-access", {
            method: "POST",
            credentials: "same-origin",
          });

          if (response.status === 401) {
            window.location.replace("/login?error=unauthenticated");
            return;
          }

          requestAccessStatus.textContent = response.ok
            ? "Access request sent."
            : "Access request could not be sent.";
        } catch {
          requestAccessStatus.textContent = "Access request could not be sent.";
        } finally {
          requestAccessButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
