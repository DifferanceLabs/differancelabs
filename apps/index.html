<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#080807">
    <title>Apps | Differance Labs</title>
    <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/portal.css">
  </head>
  <body class="portal-body">
    <header class="launcher-header">
      <a class="launcher-brand" href="/" aria-label="Differance Labs home">
        <img src="/assets/mark.svg" alt="" width="36" height="36" aria-hidden="true">
        <span>Differance Labs</span>
      </a>
      <a class="sign-out-button" href="/api/logout">Sign out</a>
    </header>

    <main class="launcher-shell" aria-labelledby="apps-title">
      <section class="launcher-title">
        <p class="portal-kicker" id="user-email">Loading</p>
        <h1 id="apps-title">Apps</h1>
      </section>

      <section class="apps-grid" id="apps-grid" aria-live="polite"></section>

      <section class="empty-state" id="empty-state" hidden>
        <h2>No apps yet</h2>
        <p>Access can be granted by updating the site environment variables.</p>
      </section>
    </main>

    <script>
      const grid = document.querySelector("#apps-grid");
      const emptyState = document.querySelector("#empty-state");
      const userEmail = document.querySelector("#user-email");
      const accents = ["#84a792", "#d9b36c", "#c77c64", "#7aa6d9", "#b69ad8", "#79b8a9", "#e2e0d6"];

      function createCard(app, index) {
        const card = document.createElement(app.url ? "a" : "article");
        card.className = "app-card";
        card.style.setProperty("--card-accent", accents[index % accents.length]);

        if (app.url) {
          card.href = app.url;

          if (!app.url.startsWith("/") && !app.url.startsWith(window.location.origin)) {
            card.target = "_blank";
            card.rel = "noopener noreferrer";
          }
        } else {
          card.setAttribute("aria-disabled", "true");
        }

        const kind = document.createElement("span");
        kind.className = "app-kind";
        kind.textContent = app.kind;

        const title = document.createElement("span");
        title.className = "app-name";
        title.textContent = app.name;

        const status = document.createElement("span");
        status.className = "app-status";
        status.textContent = app.url ? "Open" : "URL not configured";

        card.append(kind, title, status);
        return card;
      }

      async function loadApps() {
        const response = await fetch("/api/session", { credentials: "same-origin" });

        if (response.status === 401 || response.status === 403) {
          window.location.replace(`/login?error=${response.status === 403 ? "access_denied" : "unauthenticated"}`);
          return;
        }

        if (!response.ok) {
          userEmail.textContent = "Unavailable";
          emptyState.hidden = false;
          return;
        }

        const session = await response.json();
        userEmail.textContent = session.user.email;

        if (!session.apps.length) {
          emptyState.hidden = false;
          return;
        }

        grid.replaceChildren(...session.apps.map(createCard));
      }

      loadApps().catch(() => {
        userEmail.textContent = "Unavailable";
        emptyState.hidden = false;
      });
    </script>
  </body>
</html>
