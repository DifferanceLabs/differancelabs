name: Art Class Check-In
on:
  push:
    branches: [main, "feat/art-class-checkin"]
    paths:
      [
        "projects/art-class-checkin/**",
        "api/**",
        "tests/**",
        ".github/workflows/art-class-checkin.yml",
      ]
  pull_request:
    paths:
      [
        "projects/art-class-checkin/**",
        "api/**",
        "tests/**",
        ".github/workflows/art-class-checkin.yml",
      ]
permissions:
  contents: read
concurrency:
  group: art-class-checkin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: projects/art-class-checkin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: projects/art-class-checkin/package-lock.json
      - run: node --test tests/*.test.js
        working-directory: .
      - run: npm ci
      - run: npm audit --package-lock-only --ignore-scripts --audit-level=high
      - run: npm run demo:setup
      - run: npm run check
      - run: npm test
      - run: npm run demo:reset
      - run: npm run build
      - name: Build optional Netlify adapter
        run: npx --yes netlify-cli@27.5.0 build --offline --context deploy-preview
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          ART_BROWSER_BUILT: "1"
      - name: Walk through the fictional studio as staff and manager
        run: npm run test:simulation:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: fictional-demo-test-results
          path: projects/art-class-checkin/test-results/
