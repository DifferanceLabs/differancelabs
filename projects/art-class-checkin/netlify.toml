# Optional no-subscription-charge host for this isolated app only.
# Set the Netlify project's Base directory to projects/art-class-checkin.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp", "pdfkit"]
  included_files = ["node_modules/pdfkit/js/data/**"]

[build.processing]
  skip_processing = true

[dev]
  framework = "#static"
  publish = "dist"
  port = 8888
  autoLaunch = false

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Only the four client views need an HTML fallback. Keep assets and errors
# out of a catch-all rewrite, including in Netlify's Windows emulator.
[[redirects]]
  from = "/today"
  to = "/index.html"
  status = 200
  force = true
[[redirects]]
  from = "/students"
  to = "/index.html"
  status = 200
  force = true
[[redirects]]
  from = "/classes"
  to = "/index.html"
  status = 200
  force = true
[[redirects]]
  from = "/history"
  to = "/index.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
